[package]
name = "migration"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
publish = false

[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
loco-rs = { workspace = true }
# `muy_loco_admin::migrations::roles`: the admin's roles table.
muy-loco-admin = { workspace = true }

[dependencies.sea-orm-migration]
version = "=2.0.4"
features = ["runtime-tokio-rustls"]
