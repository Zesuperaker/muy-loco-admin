[package]
name = "muy-loco-admin"
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
description = "An auto-generated admin dashboard for Loco apps, driven by SeaORM entity metadata"
repository = "https://github.com/zesuperaker/muy-loco-admin"
readme = "README.md"
keywords = ["loco", "admin", "dashboard", "sea-orm", "axum"]
categories = ["web-programming", "web-programming::http-server"]
include = [
    "/src/**/*.rs",
    "/frontend/dist/**",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
]

[features]
default = ["jwt"]
# `JwtAuth`: authenticate admin users with Loco's JWT auth.
jwt = ["loco-rs/auth"]

# Version floors mirror loco-rs 1.3.0's own requirements; crates loco-rs does
# not depend on use their latest release as the floor.
[dependencies]
# `auth_session`: the login form signs users in with a Loco session cookie.
loco-rs = { version = "1.3.0", default-features = false, features = ["with-db", "auth_session"] }
sea-orm = { version = "2.0", default-features = false, features = [
    "macros",
    "with-json",
    "with-chrono",
    "with-uuid",
    "with-rust_decimal",
] }
# `muy_loco_admin::migrations::roles`: the roles table, added to the app's `Migrator`.
sea-orm-migration = { version = "2.0", default-features = false }
axum = { version = "0.8.1", default-features = false, features = ["json", "query"] }
async-trait = "0.1.74"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.45", default-features = false, features = ["rt", "sync", "time"] }
tracing = "0.1.40"
csv = "1.4.0"
percent-encoding = "2.3.2"
rust-embed = { version = "8.13.0", features = ["debug-embed", "mime-guess"] }

[dev-dependencies]
loco-rs = { version = "=1.3.0", default-features = false, features = [
    "with-db",
    "auth",
    "auth_session",
    "compression",
] }
sea-orm = { version = "=2.0.4", features = [
    "sqlx-sqlite",
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread"] }
tower = { version = "=0.5.3", features = ["util"] }
http-body-util = "=0.1.5"
# Generates `frontend/src/bindings.ts` from the API's types (see `src/bindings.rs`).
ts-rs = { version = "=12.0.1", features = ["serde-json-impl"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
