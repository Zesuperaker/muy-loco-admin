name: CI

# Pushes to main run CI inside release.yml, which calls this workflow before releasing.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.99.1
  MSRV: 1.94.0
  NODE_VERSION: 26.13.0

jobs:
  crate-lint:
    name: Crate lint and package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Package (builds the crate as published)
        run: cargo package --locked

  crate-test:
    name: Crate tests (${{ matrix.database }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://postgres:postgres@localhost:5432/postgres' || '' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component llvm-tools-preview
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: taiki-e/install-action@v2.90.3
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Test with coverage
        run: cargo llvm-cov --locked --fail-under-lines 90 --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-${{ matrix.database }}
          path: lcov.info

  msrv:
    name: Crate MSRV
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install "$MSRV" --profile minimal
          rustup default "$MSRV"
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo check --locked --all-targets

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build
      - name: Committed bundle is up to date
        run: |
          git status --porcelain -- dist
          test -z "$(git status --porcelain -- dist)"

  dogfood:
    name: Dogfood app tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: loco
          POSTGRES_PASSWORD: loco
          POSTGRES_DB: dogfood_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loco -d dogfood_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
    defaults:
      run:
        working-directory: dogfood
    env:
      DATABASE_URL: postgres://loco:loco@localhost:5432/dogfood_test
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: dogfood
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  e2e:
    name: End-to-end (Docker)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build the app image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: dogfood/Dockerfile
          tags: muy-loco-admin-dogfood-app:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the stack
        working-directory: dogfood
        run: |
          docker compose up -d --no-build
          for _ in $(seq 1 90); do
            curl -fs http://localhost:5150/_ping && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dogfood/e2e/package-lock.json
      - name: Run Playwright
        working-directory: dogfood/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
      - name: App logs
        if: failure()
        working-directory: dogfood
        run: docker compose logs app
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            dogfood/e2e/playwright-report
            dogfood/e2e/test-results
      - name: Stop the stack
        if: always()
        working-directory: dogfood
        run: docker compose down -v
