version: 2
updates:
  - package-ecosystem: cargo
    directories: ["/", "/dogfood"]
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: npm
    directories: ["/frontend", "/dogfood/e2e"]
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/dogfood"
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: "/dogfood"
    schedule:
      interval: weekly
